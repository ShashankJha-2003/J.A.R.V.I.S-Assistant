name: Deploy J.A.R.V.I.S. Live HUD to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "jarvis/web/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: true

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild docs/ static bundle
        run: python3 scripts/build_pages.py
      - name: Publish docs/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild docs/ static bundle"
          fi
          TREE=$(git rev-parse HEAD:docs)
          PARENT=""
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            PARENT="-p origin/gh-pages"
          fi
          COMMIT=$(echo "Deploy J.A.R.V.I.S. Live HUD from ${GITHUB_SHA::7}" | git commit-tree "$TREE" $PARENT)
          git push origin "$COMMIT:refs/heads/gh-pages"
