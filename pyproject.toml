[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice-assistant"
version = "2.0.0"
description = "J.A.R.V.I.S. — Advanced Python AI Voice Control Assistant with Multi-LLM Tool Calling, Semantic RAG Memory, System Automation & Real-Time Holographic HUD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "psutil>=6.0.0",
    "rich>=13.7.0",
    "edge-tts>=6.1.12",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.4.7",
    "PyAutoGUI>=0.9.54",
    "PyGetWindow>=0.0.9",
    "pyperclip>=1.9.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "wikipedia>=1.4.0",
]

[project.optional-dependencies]
neural = [
    "faster-whisper>=1.0.3",
    "openwakeword>=0.6.0",
]
windows-audio = [
    "pycaw>=20240210",
    "comtypes>=1.4.0",
    "pywin32>=306",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
